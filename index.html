<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stok Dapur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== LOGIN ===== -->
  <div id="login-page" class="login-page">
    <div class="login-box">
      <h1 class="login-title">Stok Dapur</h1>
      <p class="login-sub">Masuk untuk mengelola stok bahan baku</p>
      <form id="form-login" autocomplete="off">
        <div class="field">
          <label for="login-user">Username</label>
          <input type="text" id="login-user" placeholder="Masukkan username" required>
        </div>
        <div class="field">
          <label for="login-pass">Password</label>
          <input type="password" id="login-pass" placeholder="Masukkan password" required>
        </div>
        <div id="login-error" class="err" style="display:none"></div>
        <button type="submit" class="btn btn-green btn-full">Masuk</button>
      </form>
    </div>
  </div>

  <!-- ===== APP ===== -->
  <div id="app" style="display:none">

    <!-- Top bar -->
    <header class="topbar">
      <h1 class="topbar-title">Stok dapur</h1>
      <div class="topbar-right">
        <span class="user-tag" id="user-tag"></span>
        <nav class="tabs" id="nav-tabs">
          <button class="tab-btn active" data-tab="rak">Rak</button>
          <button class="tab-btn" data-tab="catat">Catat</button>
          <button class="tab-btn" data-tab="jurnal">Jurnal</button>
        </nav>
      </div>
    </header>

    <!-- Layout: content + bon -->
    <div class="layout">

      <!-- Main content -->
      <div class="content">

        <!-- ── RAK ── -->
        <section id="tab-rak" class="tab-panel active">
          <div class="summary" id="summary-bar"></div>
          <div class="bahan-grid" id="bahan-grid"></div>

          <!-- Tambah bahan (collapsible) -->
          <details class="details-add" id="details-add">
            <summary>Tambah bahan baru</summary>
            <form id="form-tambah" class="form-add" autocomplete="off">
              <div class="field-row">
                <div class="field"><label>Nama bahan</label><input type="text" id="add-nama" placeholder="Contoh: Tahu putih" required></div>
                <div class="field"><label>Satuan</label><input type="text" id="add-satuan" placeholder="kg, liter, butir" required></div>
              </div>
              <div class="field-row">
                <div class="field"><label>Stok awal</label><input type="number" id="add-stok" min="0" value="0" required></div>
                <div class="field"><label>Stok minimum</label><input type="number" id="add-min" min="0" value="0" required></div>
              </div>
              <div class="field" style="max-width:calc(50% - .5rem)">
                <label>Harga satuan (Rp)</label>
                <input type="number" id="add-harga" min="0" value="0" required>
              </div>
              <input type="hidden" id="add-id" value="">
              <button type="submit" class="btn btn-green" id="btn-simpan-bahan">Simpan bahan</button>
            </form>
          </details>

          <a href="#" class="reset-link" id="reset-rak">Reset data contoh</a>
        </section>

        <!-- ── CATAT ── -->
        <section id="tab-catat" class="tab-panel">
          <div class="panel-card">
            <h2 class="panel-title">Catat bahan</h2>
            <div class="toggle-group" id="catat-toggle">
              <button class="toggle-btn active" data-type="masuk">Masuk</button>
              <button class="toggle-btn" data-type="keluar">Keluar</button>
            </div>
            <form id="form-catat" autocomplete="off">
              <div class="field">
                <label for="catat-bahan">Bahan</label>
                <select id="catat-bahan" required><option value="">Pilih bahan</option></select>
              </div>
              <div class="field">
                <label id="catat-jumlah-label">Jumlah masuk</label>
                <input type="number" id="catat-jumlah" min="1" placeholder="0" required>
              </div>
              <div class="field">
                <label>Catatan <span class="dim">(opsional)</span></label>
                <input type="text" id="catat-catatan" class="input-catatan" placeholder="Contoh: beli dari pasar">
              </div>
              <div id="catat-error" class="err" style="display:none"></div>
              <button type="submit" class="btn btn-green" id="btn-catat-submit">Catat masuk</button>
            </form>
          </div>

          <!-- Terakhir dicatat -->
          <div class="panel-card">
            <h3 class="panel-title">Terakhir dicatat</h3>
            <div id="recent-entries"></div>
            <p id="recent-empty" class="empty-text">Belum ada catatan.</p>
          </div>
        </section>

        <!-- ── JURNAL ── -->
        <section id="tab-jurnal" class="tab-panel">
          <div class="panel-card">
            <h2 class="panel-title">Jurnal stok</h2>
            <div id="jurnal-entries"></div>
            <p id="jurnal-empty" class="empty-text">Belum ada riwayat.</p>
          </div>
          <a href="#" class="reset-link" id="reset-jurnal">Reset data contoh</a>
        </section>

      </div><!-- .content -->

      <!-- Bon Belanja -->
      <aside class="bon" id="bon-belanja"></aside>

    </div><!-- .layout -->
  </div><!-- #app -->

  <!-- Confirm modal -->
  <div id="confirm-overlay" class="overlay" style="display:none">
    <div class="confirm-box">
      <p id="confirm-text">Yakin ingin menghapus bahan ini?</p>
      <div class="confirm-actions">
        <button class="btn btn-outline" id="confirm-no">Batal</button>
        <button class="btn btn-red" id="confirm-yes">Hapus</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="js/app.js"></script>
</body>
</html>
